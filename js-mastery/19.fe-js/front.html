    <!-- 4. 데이터 속성과 dataset -->
    <!-- 프런트엔드에 데이터를 내려보낼 때 첫 번째로 고려할 점은 보안. 민감한 데이터는 절대 내려보내면 X -->
    <!-- HTML과 관련된 데이터를 저장하는 공식적인 방법이 바로 데이터 속성(data attribute) -->
    <!-- 나중에 이 데이터 들을 사용해 서버에 요청을 보내게 됨 -->

    <!-- 데이터 속성의 장점?  -->
    <!-- JS 로 쉽게 접근할 수 있음! -->
    <ul>
      <li data-id="1" data-user-job="programmer">devoil</li>
      <li data-id="2" data-user-job="marketer">dragon</li>
      <li data-id="3" data-user-job="footballplayer">sonny</li>
    </ul>
    <script>
      console.log(document.querySelector('li').dataset); // {id: '1', userJob: 'programmer'}
    </script>
